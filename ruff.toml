target-version = "py312"
line-length = 100
extend-exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "release",
  "release.staging",
  "data",
]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[lint.per-file-ignores]
"main*.py" = ["E402"]
"scripts/check_live_connector.py" = ["E402"]
"tests/test_*.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
