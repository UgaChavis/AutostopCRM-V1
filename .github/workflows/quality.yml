name: AutoStop CRM quality

on:
  pull_request:
  push:
    branches:
      - autostopcrm-v1
      - "codex/**"
  workflow_dispatch:
    inputs:
      live_probes:
        description: "Run read-only production probes"
        required: false
        default: "false"
      browser_smoke:
        description: "Run the full temp-data browser smoke in addition to mandatory core"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/') }}

jobs:
  docker-runtime-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add nested PNG exclusion probe
        run: |
          mkdir -p output/docker-context-probe
          printf 'excluded-by-dockerignore\n' > output/docker-context-probe/ignored.png

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build unpublishable runtime candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: autostopcrm-ci:${{ github.sha }}
          cache-from: type=gha,scope=crm-runtime
          cache-to: type=gha,scope=crm-runtime,mode=max

      - name: Verify runtime PNG contract
        run: |
          docker run --rm \
            --entrypoint sh \
            "autostopcrm-ci:${GITHUB_SHA}" \
            -eu -c '
              test -s /app/src/minimal_kanban/static/favicon.png
              test ! -e /app/output/docker-context-probe/ignored.png
            '

      - name: Verify packaged documentation
        run: docker run --rm --entrypoint python "autostopcrm-ci:${GITHUB_SHA}" scripts/docs_audit.py --format text

      - name: Verify packaged agent browser
        run: |
          docker run --rm -i --entrypoint python "autostopcrm-ci:${GITHUB_SHA}" - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "/app/src")
          sys.path.insert(0, "/app/scripts")
          from playwright.sync_api import sync_playwright
          from browser_smoke_profiles import _probe_chromium
          from minimal_kanban.agent.web_tools import DuckDuckGoSearchClient

          assert not list(Path("/ms-playwright").glob("chromium-[0-9]*"))
          assert _probe_chromium(), "packaged headless browser must pass preflight"
          with sync_playwright() as playwright:
              browser = DuckDuckGoSearchClient()._launch_chromium(playwright)
              try:
                  page = browser.new_page()
                  page.set_content("<title>CRM runtime</title><h1>Ready</h1>")
                  assert page.title() == "CRM runtime"
                  assert page.locator("h1").inner_text() == "Ready"
              finally:
                  browser.close()
          PY

  checks:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [static, unit, browser-performance]
    # Explicit bash enables `-o pipefail`, so `python ... | tee ...`
    # steps cannot mask a failed quality gate behind tee's zero status.
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt runtime dependencies
        if: ${{ matrix.suite != 'static' }}
        run: |
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxkbcommon0 \
            libxkbfile1 \
            libxtst6 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxext6 \
            libxrender1 \
            poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Cache Chromium
        if: ${{ matrix.suite == 'browser-performance' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('requirements-runtime.txt') }}

      - name: Install Chromium for mandatory browser smoke
        if: ${{ matrix.suite == 'browser-performance' }}
        run: python -m playwright install --with-deps chromium

      - name: Validate production Compose configuration
        if: ${{ matrix.suite == 'static' }}
        env:
          AUTOSTOP_MCP_OAUTH_STATE_KEY: ci-only-oauth-state-key
          AUTOSTOP_AGENT_GATEWAY_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_WRITES_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_FINANCE_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_MAIL_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_DESTRUCTIVE_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_RAW_ENABLED: "0"
          AUTOSTOP_CRAWL4AI_API_TOKEN: ci-only-crawl4ai-api-token
          AUTOSTOP_CRAWL4AI_SECRET_KEY: ci-only-crawl4ai-secret-key
        run: |
          : > .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet

      - name: Ruff format
        if: ${{ matrix.suite == 'static' }}
        run: ruff format --check .

      - name: Ruff lint
        if: ${{ matrix.suite == 'static' }}
        run: ruff check .

      - name: Docs audit
        if: ${{ matrix.suite == 'static' }}
        run: python scripts/docs_audit.py --format text

      - name: Unit tests with runtime branch coverage
        if: ${{ matrix.suite == 'unit' }}
        run: |
          coverage erase
          coverage run -m unittest discover -s tests -v
          coverage combine
          coverage report --show-missing | tee coverage-runtime.txt
          coverage json -o coverage-runtime.json
          coverage xml -o coverage-runtime.xml
          coverage html -d htmlcov

      - name: Release backup and restore branch coverage
        if: ${{ matrix.suite == 'unit' }}
        run: |
          coverage erase
          coverage run --source=scripts -m unittest \
            tests.test_agent_release_backup \
            tests.test_agent_release_retention -v
          coverage combine
          coverage report --show-missing | tee coverage-release.txt
          coverage json -o coverage-release.json

      - name: Coverage ratchet
        if: ${{ matrix.suite == 'unit' }}
        run: python scripts/coverage_audit.py --format text

      - name: Upload coverage evidence
        if: ${{ always() && matrix.suite == 'unit' }}
        uses: actions/upload-artifact@v7
        with:
          name: branch-coverage-${{ github.sha }}
          path: |
            coverage-runtime.txt
            coverage-runtime.json
            coverage-runtime.xml
            coverage-release.txt
            coverage-release.json
            htmlcov/
          if-no-files-found: warn

      - name: Code health audit
        if: ${{ matrix.suite == 'static' }}
        run: python scripts/code_health_audit.py --format text

      - name: Localization audit
        if: ${{ matrix.suite == 'static' }}
        run: python scripts/audit_localization.py

      - name: Generated JavaScript syntax
        if: ${{ matrix.suite == 'static' }}
        run: python scripts/check_web_assets_js.py

      - name: Capability and change-feed parity
        if: ${{ matrix.suite == 'static' }}
        run: |
          python scripts/crm_capability_parity.py --require-complete
          python scripts/crm_change_feed_producer_parity.py --require-complete

      - name: Mandatory core browser smoke
        if: ${{ matrix.suite == 'browser-performance' }}
        id: core_browser_smoke
        env:
          AUTOSTOP_BROWSER_SMOKE_SCREENSHOT_DIR: output/browser-smoke-core
        run: python scripts/browser_smoke.py --profile core --attempts 1 | tee browser-smoke-core.json

      - name: Upload failed core browser smoke evidence
        if: ${{ failure() && matrix.suite == 'browser-performance' && steps.core_browser_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: core-browser-smoke-failure-${{ github.sha }}
          path: |
            browser-smoke-core.json
            output/browser-smoke-core/
          if-no-files-found: warn

      - name: Compile release probe scripts
        if: ${{ matrix.suite == 'static' }}
        run: python -m py_compile scripts/perf_probe.py scripts/perf_mcp.py scripts/perf_workflows.py scripts/finance_audit_report.py scripts/browser_smoke.py

      - name: Local temp performance probe
        if: ${{ matrix.suite == 'browser-performance' }}
        run: |
          python scripts/perf_probe.py \
            --local-temp-server \
            --iterations 1 \
            --max-snapshot-gzip-ms 1200 \
            --max-snapshot-gzip-bytes 120000 \
            --max-revision-ms 800 \
            --max-get-card-ms 800 | tee perf-probe-local.json

      - name: Stage 1 production-scale performance gates
        if: ${{ matrix.suite == 'browser-performance' }}
        run: |
          python scripts/perf_workflows.py \
            --synthetic-state-profile current-production \
            --stage1-only \
            --skip-browser \
            --warmup-iterations 2 \
            --iterations 20 \
            --max-backend-write-ms 600 \
            --max-storage-write-ms 550 \
            --max-revision-server-ms 20 \
            --max-get-card-direct-ms 20 \
            --max-list-cashboxes-ms 50 \
            --max-feed-read-ms 50 \
            --max-feed-replay-ms 20 | tee perf-stage1.json

      - name: Upload Stage 1 performance artifact
        if: ${{ always() && matrix.suite == 'browser-performance' }}
        uses: actions/upload-artifact@v7
        with:
          name: stage1-performance-${{ github.sha }}
          path: perf-stage1.json
          if-no-files-found: warn

      - name: Optional full browser smoke
        if: ${{ matrix.suite == 'browser-performance' && github.event_name == 'workflow_dispatch' && inputs.browser_smoke == 'true' }}
        run: python scripts/browser_smoke.py --profile full --attempts 1 | tee browser-smoke-full.json

      - name: Optional read-only live probes
        if: ${{ matrix.suite == 'browser-performance' && github.event_name == 'workflow_dispatch' && inputs.live_probes == 'true' }}
        run: |
          python scripts/perf_probe.py \
            --base-url https://crm.autostopcrm.ru \
            --iterations 3 \
            --max-snapshot-gzip-ms 800 \
            --max-snapshot-gzip-bytes 80000 \
            --max-revision-ms 500 \
            --max-get-card-ms 500 | tee perf-probe.json
          python scripts/finance_audit_report.py \
            --base-url https://crm.autostopcrm.ru \
            --format json | tee finance-audit.json

      - name: Upload live probe artifacts
        if: ${{ always() && matrix.suite == 'browser-performance' && github.event_name == 'workflow_dispatch' && (inputs.live_probes == 'true' || inputs.browser_smoke == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: optional-probes
          path: |
            perf-probe.json
            perf-probe-local.json
            finance-audit.json
            browser-smoke-full.json
            output/playwright/
          if-no-files-found: ignore

  quality:
    if: ${{ always() }}
    needs: [checks, docker-runtime-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release gate
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          DOCKER_RESULT: ${{ needs.docker-runtime-assets.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$DOCKER_RESULT" = success
