name: AutoStop CRM quality

on:
  pull_request:
  push:
    branches:
      - autostopcrm-v1
      - "codex/**"
  workflow_dispatch:
    inputs:
      live_probes:
        description: "Run read-only production probes"
        required: false
        default: "false"
      browser_smoke:
        description: "Run optional temp-data browser smoke"
        required: false
        default: "false"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit bash enables `-o pipefail`, so `python ... | tee ...`
    # steps cannot mask a failed quality gate behind tee's zero status.
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxkbcommon0 \
            libxkbfile1 \
            libxtst6 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxext6 \
            libxrender1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.txt
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate production Compose configuration
        env:
          AUTOSTOP_MCP_OAUTH_STATE_KEY: ci-only-oauth-state-key
          AUTOSTOP_AGENT_GATEWAY_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_WRITES_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_FINANCE_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_MAIL_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_DESTRUCTIVE_ENABLED: "0"
          AUTOSTOP_AGENT_GATEWAY_RAW_ENABLED: "0"
          AUTOSTOP_CRAWL4AI_API_TOKEN: ci-only-crawl4ai-api-token
          AUTOSTOP_CRAWL4AI_SECRET_KEY: ci-only-crawl4ai-secret-key
        run: |
          : > .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Docs audit
        run: python scripts/docs_audit.py --format text

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Code health audit
        run: python scripts/code_health_audit.py --format text

      - name: Localization audit
        run: python scripts/audit_localization.py

      - name: Generated JavaScript syntax
        run: python scripts/check_web_assets_js.py

      - name: Compile release probe scripts
        run: python -m py_compile scripts/perf_probe.py scripts/perf_workflows.py scripts/finance_audit_report.py scripts/browser_smoke.py

      - name: Local temp performance probe
        run: |
          python scripts/perf_probe.py \
            --local-temp-server \
            --iterations 1 \
            --max-snapshot-gzip-ms 1200 \
            --max-snapshot-gzip-bytes 120000 \
            --max-revision-ms 800 \
            --max-get-card-ms 800 | tee perf-probe-local.json

      - name: Stage 1 production-scale performance gates
        run: |
          python scripts/perf_workflows.py \
            --synthetic-state-profile current-production \
            --stage1-only \
            --skip-browser \
            --warmup-iterations 2 \
            --iterations 20 \
            --max-backend-write-ms 600 \
            --max-storage-write-ms 550 \
            --max-revision-server-ms 20 \
            --max-get-card-direct-ms 20 \
            --max-list-cashboxes-ms 50 \
            --max-feed-read-ms 50 \
            --max-feed-replay-ms 20 | tee perf-stage1.json

      - name: Upload Stage 1 performance artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stage1-performance-${{ github.sha }}
          path: perf-stage1.json
          if-no-files-found: warn

      - name: Optional browser smoke dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_smoke == 'true' }}
        run: python -m playwright install chromium

      - name: Optional browser smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_smoke == 'true' }}
        run: python scripts/browser_smoke.py | tee browser-smoke.json

      - name: Optional read-only live probes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_probes == 'true' }}
        run: |
          python scripts/perf_probe.py \
            --base-url https://crm.autostopcrm.ru \
            --iterations 3 \
            --max-snapshot-gzip-ms 800 \
            --max-snapshot-gzip-bytes 80000 \
            --max-revision-ms 500 \
            --max-get-card-ms 500 | tee perf-probe.json
          python scripts/finance_audit_report.py \
            --base-url https://crm.autostopcrm.ru \
            --format json | tee finance-audit.json

      - name: Upload live probe artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.live_probes == 'true' || inputs.browser_smoke == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: optional-probes
          path: |
            perf-probe.json
            perf-probe-local.json
            finance-audit.json
            browser-smoke.json
          if-no-files-found: ignore
