services:
  searxng:
    container_name: autostop-searxng
    image: docker.io/searxng/searxng@sha256:800a5e3757df04f59e6bd6c622f15de2edbfa47f5591c5b82d4a8ff3b938a845
    user: "977:977"
    init: true
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.50"
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "127.0.0.1:8890:8080"
    environment:
      SEARXNG_BASE_URL: "${AUTOSTOP_SEARXNG_PUBLIC_BASE_URL:-http://127.0.0.1:8890/}"
    volumes:
      - "${AUTOSTOP_SEARXNG_CONFIG_DIR:-./data/searxng/config}:/etc/searxng:ro"
      - "${AUTOSTOP_SEARXNG_CACHE_DIR:-./data/searxng/cache}:/var/cache/searxng"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/search?q=health&format=json', timeout=5).read(1)",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s

  crawl4ai:
    container_name: autostop-crawl4ai
    image: docker.io/unclecode/crawl4ai@sha256:bd36741e7bdd35ddc1a05d9183e1d6d8cefb61dd640d944a25d026b76e917690
    user: "appuser"
    init: true
    restart: always
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 384
    mem_limit: 1536m
    cpus: "3.00"
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: "${AUTOSTOP_CRAWL4AI_API_TOKEN:-autostop-local-crawl4ai-token-change-me}"
      SECRET_KEY: "${AUTOSTOP_CRAWL4AI_SECRET_KEY:-autostop-local-crawl4ai-secret-change-me}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; req=urllib.request.Request('http://127.0.0.1:11235/health', headers={'Authorization': 'Bearer ' + os.environ.get('CRAWL4AI_API_TOKEN', '')}); urllib.request.urlopen(req, timeout=5).read(1)\"",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s

  autostopcrm:
    container_name: autostopcrm
    image: "${AUTOSTOP_RELEASE_IMAGE:-autostopcrm-autostopcrm:latest}"
    build: .
    init: true
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: "2.00"
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    extra_hosts:
      - "crm.autostopcrm.ru:host-gateway"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:41731"
      - "127.0.0.1:8001:41831"
    environment:
      AUTOSTOP_DEPLOYMENT_ENV: "production"
      AUTOSTOP_MCP_EMBEDDED_OAUTH_ENABLED: "0"
      AUTOSTOP_MCP_OAUTH_ENABLED: "${AUTOSTOP_MCP_OAUTH_ENABLED:-1}"
      AUTOSTOP_MCP_OAUTH_STATE_KEY: "${AUTOSTOP_MCP_OAUTH_STATE_KEY:?provision with configure_mcp_oauth.py}"
      AUTOSTOP_AGENT_SERVICE_IDENTITY: "${AUTOSTOP_AGENT_SERVICE_IDENTITY:-codex-owner-agent}"
      AUTOSTOP_AGENT_GATEWAY_ENABLED: "${AUTOSTOP_AGENT_GATEWAY_ENABLED:?set explicitly to 0 or 1}"
      AUTOSTOP_AGENT_GATEWAY_WRITES_ENABLED: "${AUTOSTOP_AGENT_GATEWAY_WRITES_ENABLED:?set explicitly to 0 or 1}"
      AUTOSTOP_AGENT_GATEWAY_FINANCE_ENABLED: "${AUTOSTOP_AGENT_GATEWAY_FINANCE_ENABLED:?set explicitly to 0 or 1}"
      AUTOSTOP_AGENT_GATEWAY_MAIL_ENABLED: "${AUTOSTOP_AGENT_GATEWAY_MAIL_ENABLED:?set explicitly to 0 or 1}"
      AUTOSTOP_AGENT_GATEWAY_DESTRUCTIVE_ENABLED: "${AUTOSTOP_AGENT_GATEWAY_DESTRUCTIVE_ENABLED:?set explicitly to 0 or 1}"
      AUTOSTOP_AGENT_GATEWAY_RAW_ENABLED: "${AUTOSTOP_AGENT_GATEWAY_RAW_ENABLED:?set explicitly to 0 or 1}"
      AUTOSTOP_MAINTENANCE_MARKER: "/home/autostop/.minimal-kanban/.agent-gateway-maintenance"
      MINIMAL_KANBAN_API_HOST: "0.0.0.0"
      MINIMAL_KANBAN_API_PORT: "41731"
      MINIMAL_KANBAN_MCP_HOST: "0.0.0.0"
      MINIMAL_KANBAN_MCP_PORT: "41831"
      MINIMAL_KANBAN_AGENT_ENABLED: "${MINIMAL_KANBAN_AGENT_ENABLED:-1}"
      MINIMAL_KANBAN_AGENT_BOARD_API_URL: "${MINIMAL_KANBAN_AGENT_BOARD_API_URL:-http://127.0.0.1:41731}"
      MINIMAL_KANBAN_MCP_PATH: "/mcp"
      MINIMAL_KANBAN_MCP_PUBLIC_BASE_URL: "${AUTOSTOP_PUBLIC_SITE_URL:-https://crm.autostopcrm.ru}"
      MINIMAL_KANBAN_MCP_PUBLIC_ENDPOINT_URL: "${AUTOSTOP_PUBLIC_MCP_URL:-https://crm.autostopcrm.ru/mcp}"
      MINIMAL_KANBAN_MCP_BEARER_TOKEN: "${MINIMAL_KANBAN_MCP_BEARER_TOKEN:-}"
      MINIMAL_KANBAN_MCP_ALLOWED_HOSTS: "${AUTOSTOP_MCP_ALLOWED_HOSTS:-}"
      MINIMAL_KANBAN_MCP_ALLOWED_ORIGINS: "${AUTOSTOP_MCP_ALLOWED_ORIGINS:-}"
      AUTOSTOP_MANAGER_PATH: "${AUTOSTOP_MANAGER_CONTAINER_DIR:-/opt/AutostopManager}"
      AUTOSTOP_STORE_API_URL: "${AUTOSTOP_STORE_API_URL:-http://autostop-app:8000}"
      AUTOSTOP_STORE_READ_TOKEN: "${AUTOSTOP_STORE_READ_TOKEN:-}"
      AUTOSTOP_STORE_QUOTE_TOKEN: "${AUTOSTOP_STORE_QUOTE_TOKEN:-}"
      AUTOSTOP_STORE_MANAGE_TOKEN: "${AUTOSTOP_STORE_MANAGE_TOKEN:-}"
      AUTOSTOP_SEARCH_DISABLED_PROVIDERS: "${AUTOSTOP_SEARCH_DISABLED_PROVIDERS:-brave,tavily,google_cse}"
      AUTOSTOP_SEARCH_PROVIDER_ORDER: "${AUTOSTOP_SEARCH_PROVIDER_ORDER:-searxng,marginalia,duckduckgo}"
      AUTOSTOP_SEARXNG_BASE_URL: "${AUTOSTOP_SEARXNG_CONTAINER_URL:-http://searxng:8080}"
      AUTOSTOP_MARGINALIA_ENABLED: "${AUTOSTOP_MARGINALIA_ENABLED:-1}"
      AUTOSTOP_CRAWL4AI_BASE_URL: "${AUTOSTOP_CRAWL4AI_CONTAINER_URL:-http://crawl4ai:11235}"
      AUTOSTOP_CRAWL4AI_ENABLED: "${AUTOSTOP_CRAWL4AI_ENABLED:-1}"
      AUTOSTOP_CRAWL4AI_API_TOKEN: "${AUTOSTOP_CRAWL4AI_API_TOKEN:-autostop-local-crawl4ai-token-change-me}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4-mini}"
    volumes:
      - "${AUTOSTOP_DATA_DIR:-./data}:/home/autostop/.minimal-kanban"
      - "${AUTOSTOP_MANAGER_HOST_DIR:-/opt/autostop-manager-releases/current}:${AUTOSTOP_MANAGER_CONTAINER_DIR:-/opt/AutostopManager}:ro"
      - "${AUTOSTOP_MANAGER_DATA_HOST_DIR:-../AutostopManager/data}:${AUTOSTOP_MANAGER_CONTAINER_DIR:-/opt/AutostopManager}/data"
    networks:
      - default
      - autostop-store-agent
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  autostop-store-agent:
    name: autostop-store-agent
    external: true
