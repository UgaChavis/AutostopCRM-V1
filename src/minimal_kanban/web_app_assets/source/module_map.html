<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Инфраструктура менеджера · AutoStop</title>
  <style>
    :root { color-scheme: dark; --bg:#1d2229; --panel:#252c35; --ink:#e5e9ee; --muted:#bac2cd; --border:#45515e; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; overflow:hidden; }
    body { background:var(--bg); color:var(--ink); font:14px "Segoe UI",Arial,sans-serif; display:flex; flex-direction:column; }
    button,a { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { color:var(--ink); background:var(--panel); border:1px solid var(--border); border-radius:7px; padding:8px 11px; cursor:pointer; }
    button:hover { border-color:#91adbf; }
    button:disabled { opacity:.4; cursor:default; }
    :focus-visible { outline:2px solid #a5cce1; outline-offset:3px; }
    a { color:#bed6e5; }
    [hidden] { display:none !important; }
    .workspace { flex:1; min-height:0; display:flex; position:relative; }
    .viewport { min-width:0; flex:1; overflow:hidden; position:relative; }
    #map { display:block; width:100%; height:100%; touch-action:none; user-select:none; cursor:grab; }
    #map.is-panning { cursor:grabbing; }
    #map [data-id] { cursor:pointer; outline:none; }
    .card { fill:var(--panel); stroke:var(--color); stroke-width:1.7; }
    .node .badge { fill:#202831; stroke:var(--color); stroke-width:1.5; }
    .node text { fill:var(--ink); font-family:"Segoe UI",Arial,sans-serif; }
    .node .code { fill:var(--color); font-weight:600; font-size:17px; }
    .node .subtitle { fill:var(--muted); }
    .node.is-selected>.card,.node:focus-visible>.card { stroke:#f0f6fc; stroke-width:3; }
    .node.is-related>.card { stroke-width:2.6; }
    .node:hover>.card { fill:#303a46; }
    .wire { fill:none; stroke:var(--color); stroke-width:1.8; }
    .event .wire { stroke-dasharray:7 6; }
    .wire-hit { fill:none; stroke:transparent; stroke-width:16; pointer-events:stroke; }
    .edge:hover .wire,.edge:focus-visible .wire,.edge.is-selected .wire { stroke:#eef6ff; stroke-width:3; }
    .edge.is-related .wire { stroke-width:2.8; }
    .edge-label { fill:#202831; stroke:#657789; stroke-width:1; }
    .edge text { fill:var(--ink); font-family:"Segoe UI",Arial,sans-serif; }
    .edge.is-selected .edge-label,.edge:focus-visible .edge-label { stroke:#eef6ff; stroke-width:2; }
    .detail { width:340px; flex-shrink:0; padding:22px; background:#222a33; border-left:1px solid var(--border); overflow:auto; }
    .detail header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .detail h1 { font-size:21px; line-height:1.35; margin:16px 0; }
    .detail p { line-height:1.6; color:var(--muted); }
    .detail dl { display:grid; grid-template-columns:90px 1fr; gap:10px; line-height:1.5; }
    .detail dt { color:var(--muted); }
    .instructions li { margin:10px 0; line-height:1.5; }
    .detail dd { margin:0; overflow-wrap:anywhere; }
    .detail h2 { font-size:14px; font-weight:500; margin-top:26px; color:var(--muted); }
    .related button { display:block; width:100%; margin:7px 0; text-align:left; line-height:1.4; }
    .state { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); max-width:420px; width:85%; padding:22px; text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:12px; line-height:1.6; }
    .hint { position:absolute; left:16px; bottom:10px; color:#929daa; font-size:11px; pointer-events:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
    @media(max-width:900px) { .detail { width:290px; padding:16px; } }
    @media(max-width:600px) { .detail { position:absolute; inset:0 0 0 auto; width:min(320px,90vw); z-index:3; } .hint { display:none; } }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <main class="workspace">
    <div class="viewport" id="viewport">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Интерактивная инфраструктура менеджера" role="group" tabindex="0" hidden></svg>
      <div class="state" id="state" role="status"><p id="stateText">Загрузка карты…</p><button id="retry" type="button" hidden>Повторить</button> <a href="/" id="loginLink" hidden>Войти в CRM</a></div>
      <div class="hint" id="hint" hidden>Колесо — масштаб · Фон — перемещение · Клик — описание</div>
    </div>
    <aside class="detail" id="detail" aria-label="Описание выбранного элемента" hidden>
      <header><strong id="detailCode"></strong><button id="closeDetail" type="button" aria-label="Закрыть описание">Закрыть</button></header>
      <h1 id="detailTitle"></h1><p id="detailDescription"></p><p id="detailStatus" hidden></p><dl id="detailFacts"></dl>
      <section id="instructions" class="instructions" hidden><h2>Основные инструкции</h2><ul id="instructionLinks"></ul></section>
      <h2>Связанные элементы</h2><div class="related" id="related"></div>
    </aside>
  </main>
  <p id="announce" class="sr-only" aria-live="polite"></p>
  <script>
  (() => {
    'use strict';
    const ns = 'http://www.w3.org/2000/svg';
    const $ = id => document.getElementById(id);
    const colors = {A:'#83a9bb',B:'#83a9bb',C:'#b8a27a',D:'#a398bb',E:'#bc9290',F:'#91aa98',N:'#a2b4c3'};
    const indicatorStates = {on:{color:'#71ad86',label:'Включён'},off:{color:'#bb6868',label:'Выключен'},unknown:{color:'#bba65e',label:'Состояние неизвестно'}};
    const indicatorFor = n => n.id==='B4' ? indicatorStates[n.indicator]||indicatorStates.unknown : null;
    const icons = {
      terminal:'M3 6 L10 12 L3 18 M14 19 H23',
      document:'M5 2 H16 L23 9 V26 H5 Z M16 2 V9 H23 M9 14 H19 M9 19 H19',
      telegram:'M2 12 L26 3 L20 26 L13 18 L8 23 L9 15 L22 7 L13 18',
      person:'M19 8 A5 5 0 1 1 9 8 A5 5 0 1 1 19 8 M4 27 V24 C4 14 24 14 24 24 V27 Z',
      people:'M15 7 A4 4 0 1 1 7 7 A4 4 0 1 1 15 7 M3 26 V23 C3 14 19 14 19 23 V26 Z M21 4 A4 4 0 0 1 21 12 M23 17 Q29 19 27 26 H23',
      bell:'M5 21 H23 L21 17 V11 C21 2 7 2 7 11 V17 Z M11 25 Q14 29 17 25',
      plug:'M8 2 V10 M20 2 V10 M6 10 H22 V17 Q22 25 14 25 Q6 25 6 17 Z M14 25 V29',
      gateway:'M2 3 H26 V21 H20 V27 H8 V21 H2 Z M8 21 V14 H20 V21 M11 18 V24 M17 18 V24',
      gear:'M10 2 H18 L19 7 L24 9 L28 14 L24 19 L19 21 L18 26 H10 L9 21 L4 19 L0 14 L4 9 L9 7 Z M19 14 A5 5 0 1 1 9 14 A5 5 0 1 1 19 14',
      book:'M14 5 Q5 0 2 5 V25 Q8 21 14 26 Q20 21 26 25 V5 Q22 0 14 5 V26',
      database:'M3 6 C3 0 25 0 25 6 C25 12 3 12 3 6 V22 C3 29 25 29 25 22 V6 M3 14 C3 21 25 21 25 14',
      car:'M3 14 L7 4 H21 L25 14 V25 H21 V21 H7 V25 H3 Z M3 14 H25 M7 17 H10 M18 17 H21',
      cloud:'M7 23 C-2 23 -1 10 7 10 C8 -2 25 0 24 12 C33 13 29 25 22 23 Z',
      cart:'M1 3 H5 L9 19 H24 L28 8 H7 M13 25 A2 2 0 1 1 9 25 A2 2 0 1 1 13 25 M25 25 A2 2 0 1 1 21 25 A2 2 0 1 1 25 25',
      box:'M2 8 L14 1 L26 8 V22 L14 29 L2 22 Z M2 8 L14 15 L26 8 M14 15 V29 M8 5 L20 12'
    };
    let data, items = new Map(), nodes = new Map(), stage, selected = '', zoom = 1, tx = 0, ty = 0, fitMode = true;
    let pointer = null, suppressClick = false, loading = false;
    const el = (name, attrs={}, content) => {
      const result = document.createElementNS(ns,name);
      Object.entries(attrs).forEach(([key,value]) => result.setAttribute(key,String(value)));
      if (content !== undefined) result.textContent = content;
      return result;
    };
    const measureContext = document.createElement('canvas').getContext('2d');
    function measure(value, size, weight='normal') {
      measureContext.font=`${weight} ${size}px \"Segoe UI\",Arial,sans-serif`;
      return measureContext.measureText(value).width;
    }
    function linesFor(value, width, size) {
      const words = value.split(/\s+/), lines = []; let line = '';
      for (const word of words) {
        const next = line ? line+' '+word : word;
        if (line && measure(next,size) > width) { lines.push(line); line = word; } else line = next;
      }
      if (line) lines.push(line);
      return lines;
    }
    function textLines(group, lines, x, y, size, cls='', weight='normal') {
      const text = el('text',{x,y,'font-size':size,'font-weight':weight,class:cls});
      lines.forEach((line,index) => text.append(el('tspan',{x,dy:index ? size*1.22 : 0},line)));
      group.append(text);
    }
    function renderNode(n) {
      const indicator=indicatorFor(n);
      const g = el('g', {class:'node',transform:`translate(${n.x} ${n.y})`,'data-id':n.id,tabindex:0,role:'button','aria-label':`${n.id}: ${n.title}${indicator ? '. '+indicator.label : ''}`,'aria-pressed':'false',style:`--color:${colors[n.tone||n.group]}`});
      g.append(el('title',{},`${n.id} · ${n.title}`));
      g.append(el('rect',{class:'card',width:n.width,height:n.height,rx:n.kind==='item'?6:n.compact?9:13}));
      if (n.icon) g.append(el('path',{d:icons[n.icon],transform:'translate(18 24)',fill:'none',stroke:colors[n.tone||n.group],'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round','aria-hidden':true}));
      const nested = n.kind==='item';
      let font = n.compact?14:n.id==='A2'?26:nested?15:n.kind==='condition'?15:19;
      const start = n.compact?12:nested?49:n.icon?59:15;
      const available=n.width-start-12-(indicator?18:0);
      if(!nested&&n.kind!=='condition') {
        while(font>15&&measure(n.title,font,'600')>available) font-=.5;
      }
      while(nested&&font>11&&linesFor(n.title,available,font).length*font*1.22>n.height-7) font-=.5;
      const titleLines = linesFor(n.title,available,font);
      textLines(g,titleLines,start,n.compact?(n.height+font*.7)/2:nested?Math.max(20,(n.height-titleLines.length*font*1.22)/2+font):n.kind==='condition'?21:31,font,'',nested?'normal':'600');
      if (n.lines.length) {
        const y = Math.max(n.height>=105?68:55,31+titleLines.length*font*1.22+4);
        const sx=n.icon&&n.height<105?59:14;
        textLines(g,n.lines.flatMap(t => linesFor(t,n.width-sx-10,14)),sx,y,14,'subtitle');
      }
      const bx = nested?5:-9, by = nested?(n.height-23)/2:-12;
      g.append(el('rect',{class:'badge',x:bx,y:by,width:39,height:24,rx:4}));
      textLines(g,[n.id],bx+6,by+18,17,'code');
      if(indicator) {
        const lamp=el('g',{class:'status-indicator','aria-hidden':true});
        lamp.append(el('title',{},indicator.label));
        lamp.append(el('circle',{cx:n.width-15,cy:14,r:9,fill:indicator.color,opacity:.13}));
        lamp.append(el('circle',{class:'status-light',cx:n.width-15,cy:14,r:4.5,fill:indicator.color}));
        g.append(lamp);
      }
      stage.append(g);
    }
    function renderEdge(r) {
      const colorGroup=r.id==='L12'?'D':(nodes.get(r.from).tone||nodes.get(r.from).group);
      const color = colors[colorGroup];
      const g = el('g',{class:`edge ${r.kind}`,'data-id':r.id,tabindex:0,role:'button','aria-label':`${r.id}: ${r.from} ${r.direction==='both'?'↔':'→'} ${r.to}, ${r.label}`,'aria-pressed':'false',style:`--color:${color}`});
      g.append(el('title',{},`${r.id} · ${r.label}`));
      g.append(el('path',{class:'wire-hit',d:r.path}));
      const attrs={class:'wire',d:r.path,'marker-end':`url(#arrow-${colorGroup})`};
      if (r.direction==='both') attrs['marker-start']=attrs['marker-end'];
      g.append(el('path',attrs));
      if(r.show_label===false) {stage.append(g);return;}
      const label = r.label;
      const labelLines = linesFor(label,r.label_max_width||220,14);
      const w=label?55+Math.max(...labelLines.map(t=>measure(t,14))):42;
      const h=Math.max(28,labelLines.length*17+10), x=r.label_x-w/2, y=r.label_y-h/2;
      g.append(el('rect',{class:'edge-label',x,y,width:w,height:h,rx:5}));
      textLines(g,[r.id],x+7,y+19,15,'','600');
      if(label) textLines(g,labelLines,x+46,y+19,14);
      stage.append(g);
    }
    function render() {
      $('map').replaceChildren();
      const defs=el('defs');
      Object.entries(colors).forEach(([group,color]) => {
        const marker=el('marker',{id:`arrow-${group}`,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});
        marker.append(el('path',{d:'M1 1 L9 5 L1 9 Z',fill:color})); defs.append(marker);
      });
      $('map').append(defs); stage=el('g',{id:'stage'}); $('map').append(stage);
      data.relations.forEach(renderEdge);
      data.elements.forEach(renderNode);
    }
    function applyTransform() {
      if (!stage) return;
      stage.setAttribute('transform',`translate(${tx} ${ty}) scale(${zoom})`);
      $('map').dataset.zoom=String(zoom);
    }
    function fit() {
      if (!data) return;
      const box=$('viewport').getBoundingClientRect();
      zoom=Math.max(.1,Math.min((box.width-44)/data.canvas.width,(box.height-44)/data.canvas.height));
      tx=(box.width-data.canvas.width*zoom)/2; ty=(box.height-data.canvas.height*zoom)/2;
      fitMode=true; applyTransform();
    }
    function zoomAt(next,x,y) {
      if (!data) return;
      const box=$('viewport').getBoundingClientRect();
      x=x??box.width/2; y=y??box.height/2;
      const bounded=Math.max(.1,Math.min(4,next));
      tx=x-(x-tx)*bounded/zoom; ty=y-(y-ty)*bounded/zoom; zoom=bounded;
      fitMode=false; applyTransform();
    }
    function center(id) {
      const item=items.get(id); if(!item) return;
      const box=$('viewport').getBoundingClientRect();
      const x=item.x===undefined?item.label_x:item.x+item.width/2;
      const y=item.y===undefined?item.label_y:item.y+item.height/2;
      tx=box.width/2-x*zoom; ty=box.height/2-y*zoom; fitMode=false; applyTransform();
    }
    function rootOf(id) {
      let item=nodes.get(id);
      while(item?.parent) item=nodes.get(item.parent);
      return item?.id || id;
    }
    function relationships(id) {
      const item=items.get(id), ids=new Set();
      if(item.from) { ids.add(item.from); ids.add(item.to); }
      else {
        if(item.parent) ids.add(item.parent);
        data.elements.filter(n=>n.parent===id).forEach(n=>ids.add(n.id));
        const root=rootOf(id);
        data.relations.filter(r=>r.from===root||r.to===root).forEach(r=>{ids.add(r.id); ids.add(r.from===root?r.to:r.from);});
      }
      return ids;
    }
    function select(id, focus=false) {
      if(!items.has(id)) { clearSelection(); return; }
      selected=id; const item=items.get(id), related=relationships(id);
      $('detail').hidden=false; $('detailCode').textContent=id; $('detailTitle').textContent=item.title||item.label;
      const indicator=indicatorFor(item);
      $('detailStatus').hidden=!indicator; $('detailStatus').textContent=indicator?`Состояние: ${indicator.label.toLocaleLowerCase('ru')}`:'';
      $('instructionLinks').replaceChildren();
      for(const link of item.links||[]) {
        let url;try {url=new URL(link.url);} catch(_error) {continue;}
        if(url.protocol!=='https:'||url.hostname!=='github.com'||url.username||url.password) continue;
        const li=document.createElement('li'),a=document.createElement('a');
        a.textContent=link.title;a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';
        li.append(a);$('instructionLinks').append(li);
      }
      $('instructions').hidden=!$('instructionLinks').childElementCount;
      $('detailDescription').textContent=item.description; $('detailFacts').replaceChildren(); $('related').replaceChildren();
      if(item.from) {
        [['Направление',`${item.from} ${item.direction==='both'?'↔':'→'} ${item.to}`],['Протокол',item.protocol]].forEach(([key,value])=>{
          const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;$('detailFacts').append(dt,dd);
        });
      }
      related.forEach(other=>{
        const target=items.get(other),button=document.createElement('button');
        button.type='button'; button.textContent=`${other} · ${target.title||target.label}`;
        button.addEventListener('click',()=>select(other,true)); $('related').append(button);
      });
      stage.querySelectorAll('[data-id]').forEach(g=>{
        const active=g.dataset.id===id;g.classList.toggle('is-selected',active);g.classList.toggle('is-related',related.has(g.dataset.id));g.setAttribute('aria-pressed',String(active));
      });
      history.replaceState(null,'',`#${id}`); $('announce').textContent=`Выбран ${id}: ${item.title||item.label}`;
      requestAnimationFrame(()=>{
        if(fitMode) fit();
        if(focus) { center(id); stage.querySelector(`[data-id="${id}"]`).focus({preventScroll:true}); }
      });
    }
    function clearSelection() {
      selected=''; $('detail').hidden=true;
      if(stage) stage.querySelectorAll('[data-id]').forEach(g=>{g.classList.remove('is-selected','is-related');g.setAttribute('aria-pressed','false');});
      history.replaceState(null,'',location.pathname+location.search);
    }
    function hashSelection() { const id=location.hash.slice(1); if(items.has(id)) select(id,true); else {clearSelection();fit();} }
    async function load() {
      if(loading) return; loading=true;
      $('retry').hidden=true; $('loginLink').hidden=true; $('stateText').textContent='Загрузка карты…';
      const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
      try {
        const headers={Accept:'application/json'};
        let token='';try {token=localStorage.getItem('kanban-operator-session')||'';} catch(_error) { /* Session may be unavailable in a restricted browser. */ }
        if(token) headers['X-Operator-Session']=token;
        const response=await fetch('/api/get_module_map_infrastructure',{method:'GET',headers,credentials:'same-origin',cache:'no-store',signal:controller.signal});
        if(response.status===401||response.status===403) throw new Error('auth');
        if(!response.ok) throw new Error('network');
        const result=await response.json();
        if(!result.ok||result.data?.schema_version!=='autostopmanager.infrastructure-map.v1') throw new Error('data');
        data=result.data; nodes=new Map(data.elements.map(n=>[n.id,n])); items=new Map([...data.elements,...data.relations].map(n=>[n.id,n]));
        if(nodes.size!==30||items.size!==49||data.relations.some(r=>!nodes.has(r.from)||!nodes.has(r.to))) throw new Error('data');
        render(); $('state').hidden=true; $('map').removeAttribute('hidden'); $('hint').hidden=false;
        requestAnimationFrame(()=>{fit();hashSelection();});
      } catch(error) {
        data=undefined;items.clear();nodes.clear();
        $('state').hidden=false; $('map').setAttribute('hidden',''); $('hint').hidden=true;
        $('stateText').textContent=error.message==='auth'?'Для просмотра карты войдите в CRM под учётной записью оператора.':'Не удалось загрузить карту. Проверьте соединение и повторите попытку.';
        $('loginLink').hidden=error.message!=='auth'; $('retry').hidden=false;
      } finally {loading=false;clearTimeout(timeout);}
    }
    $('map').addEventListener('click',event=>{
      if(suppressClick) {suppressClick=false;return;}
      const target=event.target.closest('[data-id]');if(target)select(target.dataset.id);else clearSelection();
    });
    $('map').addEventListener('keydown',event=>{
      const target=event.target.closest('[data-id]');
      if(target&&(event.key==='Enter'||event.key===' ')) {event.preventDefault();select(target.dataset.id);}
    });
    $('map').addEventListener('focusin',event=>{
      const target=event.target.closest('[data-id]'); if(!target||pointer) return;
      const rect=target.getBoundingClientRect(),view=$('viewport').getBoundingClientRect();
      if(rect.left<view.left||rect.right>view.right||rect.top<view.top||rect.bottom>view.bottom)center(target.dataset.id);
    });
    $('map').addEventListener('wheel',event=>{
      if(!data)return;event.preventDefault();const rect=$('map').getBoundingClientRect();
      zoomAt(zoom*Math.exp(-event.deltaY*.0015),event.clientX-rect.left,event.clientY-rect.top);
    },{passive:false});
    $('map').addEventListener('pointerdown',event=>{
      suppressClick=false;
      if(!data||event.button!==0||event.target.closest('[data-id]')) return;
      pointer={id:event.pointerId,x:event.clientX,y:event.clientY,tx,ty,moved:false};
      $('map').setPointerCapture(event.pointerId);
    });
    $('map').addEventListener('pointermove',event=>{
      if(!pointer||pointer.id!==event.pointerId)return;
      const dx=event.clientX-pointer.x,dy=event.clientY-pointer.y;
      if(Math.abs(dx)+Math.abs(dy)>4)pointer.moved=true;
      if(pointer.moved){tx=pointer.tx+dx;ty=pointer.ty+dy;fitMode=false;$('map').classList.add('is-panning');applyTransform();}
    });
    function endPan(event) {
      if(!pointer||pointer.id!==event.pointerId)return;
      suppressClick=pointer.moved;pointer=null;$('map').classList.remove('is-panning');
      if($('map').hasPointerCapture(event.pointerId))$('map').releasePointerCapture(event.pointerId);
    }
    $('map').addEventListener('pointerup',endPan);$('map').addEventListener('pointercancel',endPan);
    $('map').addEventListener('lostpointercapture',endPan);
    $('closeDetail').addEventListener('click',()=>{const id=selected;clearSelection();stage?.querySelector(`[data-id="${id}"]`)?.focus({preventScroll:true});});
    $('retry').addEventListener('click',load);
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){const id=selected;clearSelection();stage?.querySelector(`[data-id="${id}"]`)?.focus({preventScroll:true});}
      if(event.target.matches('input,textarea'))return;
      if(event.key==='Home'){event.preventDefault();clearSelection();requestAnimationFrame(fit);}
      if(event.key==='+'||event.key==='='){event.preventDefault();zoomAt(zoom*1.2);}
      if(event.key==='-'){event.preventDefault();zoomAt(zoom/1.2);}
    });
    window.addEventListener('hashchange',()=>{if(data)hashSelection();});
    new ResizeObserver(()=>{if(data&&fitMode)fit();}).observe($('viewport'));
    load();
  })();
  </script>
</body>
</html>
