<body class="clean">
<button class="mode-toggle" id="modeToggle" type="button" aria-label="Включить редактор">Редактировать</button>
<header><div><h1>Конструктор структуры менеджера</h1><p>Модули, инструкции и маршруты связей · схема сохраняется в CRM</p></div><div class="head-actions"><span id="mode" class="badge">Загрузка…</span><a href="/" aria-label="Вернуться в CRM">Вернуться в CRM</a></div></header>
<div class="layout"><main class="main"><div class="toolbar"><button data-create="module">Внешний модуль</button><button data-create="item">Вложенный модуль</button><button data-create="compact">Компактный модуль</button><button data-create="relation">Связь</button><span class="spacer"></span><select id="jump" aria-label="Перейти к модулю или связи" style="width:min(260px,100%)"><option value="">Перейти к модулю / связи</option></select><button id="fit">Вместить схему</button><button id="expandCanvas" type="button">+ Поле</button><span id="count" aria-live="polite"></span></div><div class="canvas-wrap" id="viewport"><svg id="diagram" role="group" aria-label="Редактируемая структура менеджера" tabindex="0"></svg><div id="empty" class="empty" hidden>Схема пока пуста.<br>Создайте первый модуль.</div><div class="canvas-help">Колесо — масштаб · Фон — перемещение · Нажмите модуль или связь для редактирования</div></div></main>
<aside class="panel" id="panel"><div class="panel-head"><div><h2 id="panelTitle">Свойства</h2><p id="panelHint">Выберите модуль или создайте новый</p></div><button id="closePanel" type="button" aria-label="Закрыть свойства">×</button></div><div class="panel-scroll"><p class="notice" id="message" hidden></p><button id="reloadSchema" type="button" hidden>Перечитать актуальную схему</button><form id="editor" hidden><div class="form-grid" id="nodeFields">
<label>ID<input name="id" maxlength="32" required pattern="[A-Za-z][A-Za-z0-9_-]*"></label><label>Вид<select name="kind"><option value="module">Крупный модуль</option><option value="item">Маленький вложенный</option><option value="storage">Хранилище</option><option value="condition">Условие</option></select></label>
<label class="wide">Название<input name="title" maxlength="160" required></label><label class="wide">Инструкция / описание<textarea name="instruction" class="instruction" maxlength="30000" placeholder="Полный текст инструкции для этого модуля"></textarea></label><label class="wide">Загрузить инструкцию из файла (.txt или .md)<input id="instructionFile" type="file" accept=".txt,.md,text/plain,text/markdown"></label>
<label class="wide">Короткая подпись<textarea name="lines" class="subtitles" placeholder="Одна строка на каждую подпись"></textarea></label><label class="wide">Краткое описание<input name="description" maxlength="5000"></label>
<label>Родитель<select name="parent"></select></label><label>Иконка<select name="icon"></select></label><label>Цвет<input name="color" type="color"></label><label>Группа<input name="group" maxlength="32"></label>
<label>Индикатор<select name="indicator_mode"><option value="none">Нет</option><option value="manual">Ручной</option><option value="automation">Автоматизации CRM</option></select></label><label>Цвет индикатора<select name="indicator_state"><option value="green">Зелёный · работает</option><option value="yellow">Жёлтый · требуется внимание</option><option value="red">Красный · ошибка</option></select></label>
<label>X<input name="x" type="number" min="0" max="10000" step="1"></label><label>Y<input name="y" type="number" min="0" max="10000" step="1"></label><label>Ширина<input name="width" type="number" min="24" max="10000" step="1"></label><label>Высота<input name="height" type="number" min="24" max="10000" step="1"></label><label class="wide"><span>Компактное отображение <input name="compact" type="checkbox" style="width:auto"></span></label>
</div><div class="form-grid" id="edgeFields" hidden>
<label>ID<input name="edge_id" maxlength="32" required></label><label>Вид<select name="edge_kind"><option value="exchange">Обмен</option><option value="event">Событие</option></select></label>
<label>От модуля<select name="from"></select></label><label>К модулю<select name="to"></select></label><label>Направление<select name="direction"><option value="forward">От → к</option><option value="reverse">К → от</option><option value="both">В обе стороны ↔</option><option value="none">Без стрелок</option></select></label><label>Маршрут<select name="route_mode"><option value="auto">Автоматический</option><option value="manual">Ручной</option></select></label><label>Положение подписи<select name="label_mode"><option value="auto">Автоматическое</option><option value="manual">Точное вручную</option></select></label><label>Цвет<input name="edge_color" type="color"></label>
<label class="wide">Подпись<input name="label" maxlength="200"></label><label class="wide">Протокол / примечание<input name="protocol" maxlength="200"></label><label class="wide">Описание связи<textarea name="edge_description" rows="3" maxlength="5000"></textarea></label>
<label class="wide">Маршрут SVG (M, L, H, V, Q, C)<textarea name="path" class="route" maxlength="2000" aria-describedby="routeHelp"></textarea><span id="routeHelp">Абсолютные команды; концы маршрута закрепляются на карточках.</span></label><label>Начало · сторона<select name="from_side"><option value="left">Слева</option><option value="right">Справа</option><option value="top">Сверху</option><option value="bottom">Снизу</option></select></label><label>Начало · смещение 0–1<input name="from_offset" type="number" min="0" max="1" step="0.01"></label><label>Конец · сторона<select name="to_side"><option value="left">Слева</option><option value="right">Справа</option><option value="top">Сверху</option><option value="bottom">Снизу</option></select></label><label>Конец · смещение 0–1<input name="to_offset" type="number" min="0" max="1" step="0.01"></label><button id="routeAuto" class="wide" type="button">Построить маршрут по модулям</button><label>X подписи<input name="label_x" type="number" min="0" max="10000" step="any"></label><label>Y подписи<input name="label_y" type="number" min="0" max="10000" step="any"></label><label>Ширина подписи<input name="label_max_width" type="number" min="40" max="800"></label><label><span>Показать подпись <input name="show_label" type="checkbox" style="width:auto"></span></label><label><span>Только ID связи <input name="compact_label" type="checkbox" style="width:auto"></span></label>
</div></form></div><div class="form-actions" id="actions" hidden><button id="remove" class="danger" type="button">Удалить</button><button id="cancel" type="button">Отмена</button><button id="save" class="primary" type="submit" form="editor">Сохранить</button></div></aside></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),svgNS='http://www.w3.org/2000/svg';let diagram=null,selection=null,draft=null,scale=1,offsetX=0,offsetY=0,pan=null,requesting=false,gesture=null,dirty=false,editingVersion=null,previewSeq=0,automationState='yellow',ignoreNextClick=false,anchorTouched=false;
const palette={A:'#79b9d9',agent:'#5ecde9',B:'#73c4e8',C:'#dfb461',D:'#b497de',E:'#ec8492',F:'#8ed6ad',G:'#68dba8',H:'#d99bc9',J:'#7adbb1',N:'#a2c2d5',I:'#e9a4b5'};
const icons={terminal:'M3 6 L10 12 L3 18 M14 19 H23',document:'M5 2 H16 L23 9 V26 H5 Z M16 2 V9 H23 M9 14 H19',telegram:'M2 12 L26 3 L20 26 L13 18 L8 23 L9 15 L22 7 L13 18',person:'M19 8 A5 5 0 1 1 9 8 A5 5 0 1 1 19 8 M4 27 V24 C4 14 24 14 24 24 V27 Z',people:'M15 7 A4 4 0 1 1 7 7 A4 4 0 1 1 15 7 M3 26 V23 C3 14 19 14 19 23 V26 Z',bell:'M5 21 H23 L21 17 V11 C21 2 7 2 7 11 V17 Z',gateway:'M2 3 H26 V21 H20 V27 H8 V21 H2 Z M8 21 V14 H20 V21',gear:'M10 2 H18 L19 7 L24 9 L28 14 L24 19 L19 21 L18 26 H10 L9 21 L4 19 L0 14 L4 9 L9 7 Z M19 14 A5 5 0 1 1 9 14 A5 5 0 1 1 19 14',book:'M14 5 Q5 0 2 5 V25 Q8 21 14 26 Q20 21 26 25 V5 Q22 0 14 5 V26',database:'M3 6 C3 0 25 0 25 6 C25 12 3 12 3 6 V22 C3 29 25 29 25 22 V6',car:'M3 14 L7 4 H21 L25 14 V25 H21 V21 H7 V25 H3 Z',cloud:'M7 23 C-2 23 -1 10 7 10 C8 -2 25 0 24 12 C33 13 29 25 22 23 Z',globe:'M14 2 A12 12 0 1 1 14 26 A12 12 0 1 1 14 2 M2 14 H26',camera:'M4 6 H9 L11 3 H20 L22 6 H26 V24 H2 V6 Z',plug:'M8 2 V10 M20 2 V10 M4 10 H24 V16 C24 22 20 25 14 25 C8 25 4 22 4 16 Z',cart:'M1 3 H5 L9 19 H24 L28 8 H7',box:'M2 8 L14 1 L26 8 V22 L14 29 L2 22 Z',check:'M3 14 L11 22 L25 4',chart:'M3 25 V13 H8 V25 M11 25 V3 H16 V25 M19 25 V9 H24 V25',message:'M2 3 H26 V21 H11 L5 27 V21 H2 Z',folder:'M2 5 H11 L14 8 H26 V25 H2 Z',spark:'M14 1 L17 11 L27 14 L17 17 L14 27 L11 17 L1 14 L11 11 Z',mail:'M2 5 H26 V23 H2 Z M2 6 L14 16 L26 6',clock:'M14 2 A12 12 0 1 1 14 26 A12 12 0 1 1 14 2 M14 7 V14 L20 18',photo:'M2 4 H26 V24 H2 Z M5 20 L11 13 L15 17 L20 10 L26 20',audio:'M3 11 H8 L15 5 V23 L8 17 H3 Z M19 9 Q25 14 19 19',video:'M2 5 H21 V23 H2 Z M21 10 L27 6 V22 L21 18',brain:'M10 4 C2 0 0 8 4 13 C0 18 3 26 12 25 V4 M18 4 C26 0 28 8 24 13 C28 18 25 26 16 25 V4',decision:'M14 1 L27 14 L14 27 L1 14 Z',note:'M2 2 H26 V26 H2 Z M6 8 H22 M6 14 H20 M6 20 H17'};
const E=$('editor').elements;for(const name of ['',...Object.keys(icons)])E.icon.add(new Option(name||'Без иконки',name));
function headers(json=false){const h={Accept:'application/json'};try{const token=localStorage.getItem('kanban-operator-session');if(token)h['X-Operator-Session']=token;}catch(_error){}if(json)h['Content-Type']='application/json';return h}
function notice(message,error=false){$('message').textContent=message;$('message').classList.toggle('error',error);$('message').hidden=!message}
async function api(path,payload){const response=await fetch(path,{method:payload?'POST':'GET',headers:headers(Boolean(payload)),credentials:'same-origin',cache:'no-store',body:payload?JSON.stringify(payload):undefined});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok){const error=new Error(result.error?.message||`HTTP ${response.status}`);error.code=result.error?.code;throw error}return result.data}
async function load(fitView=false){try{diagram=await api('/api/manager_structure');$('mode').textContent=diagram.can_edit?'Владелец · редактирование':'Просмотр';document.querySelectorAll('[data-create]').forEach(button=>button.disabled=!diagram.can_edit);populateJump();render();if(fitView)fit()}catch(error){notice(error.message,true);$('mode').textContent='Нет доступа'}}
function S(tag,attrs={},text){const el=document.createElementNS(svgNS,tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,String(value));if(text!==undefined)el.textContent=text;return el}
function color(item){return item.color||palette[item.tone]||palette[item.group]||'#91b8ca'}
function cut(text,max){return String(text||'').length>max?String(text).slice(0,max-1)+'…':String(text||'')}
function routeSegments(path){
  const tokens=String(path||'').match(/[MLHVQC]|[+-]?(?:\d+(?:\.\d*)?|\.\d+)/g)||[],points=[];
  const midpoint=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const distance=(p,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,length=dx*dx+dy*dy;if(!length)return Math.hypot(p.x-a.x,p.y-a.y);const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/length));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)};
  const quadratic=(a,c,b,depth=0)=>{if(depth>=9||distance(c,a,b)<=.5)return[b];const ac=midpoint(a,c),cb=midpoint(c,b),m=midpoint(ac,cb);return[...quadratic(a,ac,m,depth+1),...quadratic(m,cb,b,depth+1)]};
  const cubic=(a,c1,c2,b,depth=0)=>{if(depth>=9||Math.max(distance(c1,a,b),distance(c2,a,b))<=.5)return[b];const ac1=midpoint(a,c1),c12=midpoint(c1,c2),c2b=midpoint(c2,b),left=midpoint(ac1,c12),right=midpoint(c12,c2b),m=midpoint(left,right);return[...cubic(a,ac1,left,m,depth+1),...cubic(m,right,c2b,b,depth+1)]};
  let x=0,y=0;
  for(let i=0;i<tokens.length;){const cmd=tokens[i++];if(cmd==='M'){x=Number(tokens[i++]);y=Number(tokens[i++]);points.push({x,y})}else if(cmd==='L'){x=Number(tokens[i++]);y=Number(tokens[i++]);points.push({x,y})}else if(cmd==='H'){x=Number(tokens[i++]);points.push({x,y})}else if(cmd==='V'){y=Number(tokens[i++]);points.push({x,y})}else if(cmd==='Q'){const a={x,y},c={x:Number(tokens[i++]),y:Number(tokens[i++])},b={x:Number(tokens[i++]),y:Number(tokens[i++])};points.push(...quadratic(a,c,b));x=b.x;y=b.y}else if(cmd==='C'){const a={x,y},c1={x:Number(tokens[i++]),y:Number(tokens[i++])},c2={x:Number(tokens[i++]),y:Number(tokens[i++])},b={x:Number(tokens[i++]),y:Number(tokens[i++])};points.push(...cubic(a,c1,c2,b));x=b.x;y=b.y}else return []}

function bridgePaths(relations){
  const routes=new Map(relations.map(edge=>[edge.id,routeSegments(edge.path)])),bridges=new Map;
  const intersects=(first,second)=>{const [a,b]=first,[c,d]=second,rx=b.x-a.x,ry=b.y-a.y,sx=d.x-c.x,sy=d.y-c.y,den=rx*sy-ry*sx;if(Math.abs(den)<1e-7)return null;const qx=c.x-a.x,qy=c.y-a.y,t=(qx*sy-qy*sx)/den,u=(qx*ry-qy*rx)/den;if(t<.02||t>.98||u<.02||u>.98)return null;return{x:a.x+t*rx,y:a.y+t*ry}}
  for(let i=0;i<relations.length;i++)for(let j=i+1;j<relations.length;j++){
    const first=relations[i],second=relations[j],bridged=first.id.localeCompare(second.id,undefined,{numeric:true})>0?first:second,over=bridged===first?routes.get(first.id):routes.get(second.id),under=bridged===first?routes.get(second.id):routes.get(first.id);
    over.forEach(a=>under.forEach(b=>{const point=intersects(a,b);if(!point)return;const items=bridges.get(bridged.id)||[];if(items.some(item=>Math.hypot(item.x-point.x,item.y-point.y)<8))return;items.push({...point,a,b});bridges.set(bridged.id,items)}));
  }

  gesture.timer=setTimeout(async()=>{try{const result=await api('/api/manager_structure/apply',{operation:'layout_relation',relation,expected_version:original.version,idempotency_key:crypto.randomUUID(),preview:true});if(!gesture||gesture.previewTarget!==target||seq!==previewSeq)return;diagram={...result.diagram,can_edit:original.can_edit};render();$('stage').querySelector(`.edge[data-id="${relation.id}"] path.wire`)?.setAttribute('stroke-dasharray','6 5');gesture.validPreview=true}catch(_error){if(gesture&&seq===previewSeq)gesture.validPreview=false}},120)
}
$('diagram').addEventListener('pointerdown',event=>{if(event.button!==0||!diagram?.can_edit||document.body.classList.contains('clean'))return;const action=event.target.closest('[data-action]'),node=event.target.closest('.node'),edge=event.target.closest('.edge');if(!node&&!action)return;if(dirty){notice('Сначала сохраните или отмените текст в форме.',true);return}const kind=action?.dataset.action||'move',id=kind==='reconnect'?(action.dataset.edgeId||edge?.dataset.id):node?.dataset.id;if(!id)return;gesture={kind,id,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,original:structuredClone(diagram),moved:false,timer:null};$('diagram').setPointerCapture(event.pointerId)});
$('diagram').addEventListener('pointermove',event=>{
  if(!gesture||gesture.pointerId!==event.pointerId)return;
  const dx=(event.clientX-gesture.startX)/scale,dy=(event.clientY-gesture.startY)/scale;
  if(Math.abs(dx)+Math.abs(dy)>3)gesture.moved=true;
  if(!gesture.moved)return;
  if(gesture.kind==='move'||gesture.kind==='resize'){
    const initial=gesture.original.elements.find(item=>item.id===gesture.id),node=diagram.elements.find(item=>item.id===gesture.id);
    if(!initial||!node)return;
    if(gesture.kind==='move'){
      node.x=Math.max(0,Math.min(diagram.canvas.width-node.width,Math.round(initial.x+dx)));
      node.y=Math.max(0,Math.min(diagram.canvas.height-node.height,Math.round(initial.y+dy)));
    }else{
      node.width=Math.max(node.kind==='item'?75:95,Math.min(diagram.canvas.width-node.x,Math.round(initial.width+dx)));
      node.height=Math.max(node.kind==='item'?31:48,Math.min(diagram.canvas.height-node.y,Math.round(initial.height+dy)));
    }
    render();schedulePreview();
    return;
  }
  const original=gesture.original,source=gesture.kind==='connect'?original.elements.find(item=>item.id===gesture.id):original.elements.find(item=>item.id===original.relations.find(rel=>rel.id===gesture.id)?.from);
  if(!source)return;
  const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('.node')?.dataset.id;
  if(target&&target!==source.id){
    if(gesture.previewTarget!==target){diagram=original;render();scheduleRelationPreview(target)}
    if(gesture.validPreview)return;
  }else if(gesture.previewTarget){
    clearTimeout(gesture.timer);previewSeq++;gesture.previewTarget=null;gesture.validPreview=false;diagram=original;render();
  }
  const point=canvasPoint(event),stage=$('stage');
  stage.querySelector('#draftWire')?.remove();
  stage.append(S('path',{id:'draftWire',d:`M${source.x+source.width} ${source.y+source.height/2} H${point.x} V${point.y}`,fill:'none',stroke:'#a5dec8','stroke-width':2,'stroke-dasharray':'6 5','pointer-events':'none'}));
});
$('diagram').addEventListener('pointerup',async event=>{if(!gesture||gesture.pointerId!==event.pointerId)return;const active=gesture;gesture=null;clearTimeout(active.timer);previewSeq++;ignoreNextClick=true;setTimeout(()=>{ignoreNextClick=false},100);if(!active.moved){const node=diagram.elements.find(item=>item.id===active.id);if(node)select('element',node.id,node);else render();return}if(active.kind==='move'||active.kind==='resize'){const node=diagram.elements.find(item=>item.id===active.id);if(!node)return;const element={id:node.id,x:node.x,y:node.y,width:node.width,height:node.height};diagram=active.original;render();const saved=await mutate({operation:'layout_element',element});if(!saved){diagram=active.original;render()}return}const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('.node')?.dataset.id;diagram=active.original;render();if(!target)return;const prior=active.kind==='reconnect'?diagram.relations.find(item=>item.id===active.id):null,from=prior?.from||active.id;if(target===from)return;const relation={id:prior?.id||nextId('R'),from,to:target,kind:prior?.kind||'exchange',direction:prior?.direction||'forward',label:prior?.label||'',color:prior?.color||'#91b8ca'};const saved=await mutate({operation:'layout_relation',relation});if(!saved){const errorText=$('message').textContent;select('relation',relation.id,{...relation,path:'M0 0',label_x:0,label_y:0},!prior);notice(errorText,true)}});
$('diagram').addEventListener('pointercancel',()=>{if(!gesture)return;clearTimeout(gesture.timer);previewSeq++;diagram=gesture.original;gesture=null;render()});
async function refreshAutomation(){try{const status=await api('/api/automation_center/status'),state=String(status.controller?.overall_state||status.overall_state||'unknown').toLowerCase();automationState=['error','failed','unhealthy','off'].includes(state)?'red':state==='on'?'green':'yellow';if(diagram&&!gesture)render()}catch(_error){automationState='yellow';if(diagram&&!gesture)render()}}
async function pollDiagram(){if(!diagram||gesture||requesting||document.hidden)return;try{const fresh=await api('/api/manager_structure');if(fresh.version===diagram.version)return;diagram=fresh;populateJump();if(dirty){render();notice('Диаграмма обновлена после внешней правки. Ваш несохранённый текст оставлен в форме; перед записью перечитайте актуальные свойства.',true);$('reloadSchema').hidden=false;return}const selected=selection&&(selection.type==='element'?fresh.elements:fresh.relations).find(item=>item.id===selection.id);if(selected)select(selection.type,selected.id,selected);else render();notice('Схема обновлена после внешней правки.')}catch(_error){/* Keep the last readable diagram while offline. */}}
setInterval(pollDiagram,5000);setInterval(refreshAutomation,15000);refreshAutomation();
$('diagram').addEventListener('click',event=>{if(ignoreNextClick){ignoreNextClick=false;return}if(pan?.moved){pan=null;return}const target=event.target.closest('[data-id]');if(!target){close();return}const type=target.dataset.type,id=target.dataset.id,obj=(type==='element'?diagram.elements:diagram.relations).find(item=>item.id===id);if(obj)select(type,id,obj)});$('diagram').addEventListener('keydown',event=>{if(!['Enter',' '].includes(event.key))return;const target=event.target.closest('[data-id]');if(target){event.preventDefault();target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('diagram').addEventListener('wheel',event=>{event.preventDefault();const rect=$('diagram').getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top,next=Math.min(4,Math.max(.12,scale*Math.exp(-event.deltaY*.0015)));offsetX=x-(x-offsetX)*next/scale;offsetY=y-(y-offsetY)*next/scale;scale=next;transform()},{passive:false});$('diagram').addEventListener('pointerdown',event=>{if(event.button!==0||gesture||event.target.closest('[data-id],[data-action]'))return;pan={id:event.pointerId,x:event.clientX,y:event.clientY,ox:offsetX,oy:offsetY,moved:false};$('diagram').setPointerCapture(event.pointerId)});$('diagram').addEventListener('pointermove',event=>{if(!pan||pan.id!==event.pointerId)return;const dx=event.clientX-pan.x,dy=event.clientY-pan.y;if(Math.abs(dx)+Math.abs(dy)>4)pan.moved=true;if(pan.moved){offsetX=pan.ox+dx;offsetY=pan.oy+dy;$('diagram').classList.add('dragging');transform()}});$('diagram').addEventListener('pointerup',()=>{$('diagram').classList.remove('dragging')});window.addEventListener('resize',()=>{if(!diagram)return;const obj=(selection?.type==='element'?diagram.elements:diagram.relations).find(item=>item.id===selection?.id);if(obj)focusItem(selection.type,obj);else fit()});load(true);
})();
</script>
